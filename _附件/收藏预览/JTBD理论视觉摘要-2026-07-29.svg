<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">JTBD 理论视觉摘要</title>
  <desc id="desc">展示从用户情境到进展目标、雇佣产品、评价结果和发现创新机会的 Jobs to be Done 流程。</desc>
  <rect width="1200" height="720" fill="#f7f4ee"/>
  <rect x="48" y="44" width="1104" height="632" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="84" y="112" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="46" font-weight="700" fill="#111827">JTBD：用户不是买产品，而是在“雇佣”方案完成进展</text>
  <text x="86" y="158" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="22" fill="#4b5563">Jobs to be Done 用具体情境、动机、障碍和期待结果解释用户选择。</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <g font-family="Arial, 'Noto Sans SC', sans-serif">
    <rect x="86" y="244" width="182" height="126" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="117" y="290" font-size="27" font-weight="700" fill="#0c4a6e">情境</text>
    <text x="117" y="327" font-size="20" fill="#075985">发生了什么？</text>
    <text x="117" y="354" font-size="20" fill="#075985">限制是什么？</text>

    <line x1="286" y1="307" x2="365" y2="307" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="384" y="244" width="206" height="126" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="419" y="290" font-size="27" font-weight="700" fill="#14532d">想要的进展</text>
    <text x="419" y="327" font-size="20" fill="#166534">用户真正想</text>
    <text x="419" y="354" font-size="20" fill="#166534">完成的 Job</text>

    <line x1="608" y1="307" x2="687" y2="307" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="706" y="244" width="184" height="126" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="737" y="290" font-size="27" font-weight="700" fill="#78350f">雇佣方案</text>
    <text x="737" y="327" font-size="20" fill="#92400e">产品、服务</text>
    <text x="737" y="354" font-size="20" fill="#92400e">或替代做法</text>

    <line x1="909" y1="307" x2="988" y2="307" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1007" y="244" width="106" height="126" rx="14" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
    <text x="1033" y="291" font-size="27" font-weight="700" fill="#701a75">结果</text>
    <text x="1026" y="329" font-size="20" fill="#86198f">是否更好</text>
    <text x="1038" y="356" font-size="20" fill="#86198f">完成？</text>

    <rect x="116" y="470" width="968" height="118" rx="16" fill="#111827"/>
    <text x="154" y="518" font-size="25" font-weight="700" fill="#ffffff">用处</text>
    <text x="154" y="557" font-size="22" fill="#e5e7eb">把“我们要做什么功能”改写成“用户在哪个情境下，为什么需要进展，现有方案哪里不够”。</text>
  </g>
</svg>
