<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f1f4f6"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#162b3e"><text x="48" y="68" font-size="34" font-weight="700">纤体瓶复盘指导 · 校正文字稿</text><text x="48" y="115" font-size="22" fill="#465565">可跨设备读取的复盘对话文字记录</text><rect x="48" y="185" width="1104" height="90" rx="14" fill="#ffffff" stroke="#d4d9dc"/><text x="72" y="220" font-size="23" font-weight="600">素材内容</text><text x="72" y="252" font-size="19" fill="#465565">保留原始对话正文与复盘指导</text><rect x="48" y="297" width="1104" height="90" rx="14" fill="#ffffff" stroke="#d4d9dc"/><text x="72" y="332" font-size="23" font-weight="600">复用方式</text><text x="72" y="364" font-size="19" fill="#465565">读取文字稿，整理复盘关注点与整改事项</text><rect x="48" y="409" width="1104" height="90" rx="14" fill="#ffffff" stroke="#d4d9dc"/><text x="72" y="444" font-size="23" font-weight="600">原始音频</text><text x="72" y="476" font-size="19" fill="#465565">保留本机来源链接；音频未纳入收藏库或远程同步</text><text x="48" y="596" font-size="17" fill="#596775">依据本卡记录整理 · 非重新转写或重新听取音频</text></g></svg>