<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f1f4f6"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#162b3e"><text x="48" y="68" font-size="34" font-weight="700">自部署应用 · 从收藏到取舍</text><text x="48" y="115" font-size="22" fill="#465565">文章盘点：15 个已下线应用，7 个保留应用</text><rect x="48" y="185" width="1104" height="90" rx="14" fill="#ffffff" stroke="#d4d9dc"/><text x="72" y="220" font-size="23" font-weight="600">先问实际需求</text><text x="72" y="252" font-size="19" fill="#465565">这个应用是否经常使用，是否必须依赖自己的服务器？</text><rect x="48" y="297" width="1104" height="90" rx="14" fill="#ffffff" stroke="#d4d9dc"/><text x="72" y="332" font-size="23" font-weight="600">再看替代方式</text><text x="72" y="364" font-size="19" fill="#465565">已有系统服务或托管工具能否满足需求？</text><rect x="48" y="409" width="1104" height="90" rx="14" fill="#ffffff" stroke="#d4d9dc"/><text x="72" y="444" font-size="23" font-weight="600">最后算维护成本</text><text x="72" y="476" font-size="19" fill="#465565">升级、备份和故障处理是否值得持续投入？</text><text x="48" y="596" font-size="17" fill="#596775">依据收藏文章摘要整理 · 判断来自作者的个人使用语境</text></g></svg>